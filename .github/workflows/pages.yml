# Publica el sitio de Timbre en GitHub Pages.
# El sitio principal está en Netlify (netlify.toml); este workflow queda como
# alternativa y solo corre a mano (Actions → Publicar en GitHub Pages → Run).
# Para que vuelva a correr en cada push, agregue:  push: { branches: [main] }
name: Publicar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar los JSON
        run: node scripts/validar.js

      - name: Armar la carpeta del sitio
        # Publica las entregas de ejemplo (ficticias); nunca negocios/privado
        # ni entregas de clientes reales.
        run: node scripts/armar-sitio.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
